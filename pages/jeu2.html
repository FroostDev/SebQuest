<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafting crafting</title>
    <!-- <link rel="stylesheet" href="../assets/styles/base.css"> -->
    <link rel="stylesheet" href="../assets/styles/jeu2.css">
</head>

<body>

    <main>
        <canvas id="gameCanva"></canvas>

        <div id="recipe-container">
            <div id="recipe-items">
                <!-- Les ingrédients de la "recette" seront ajoutés ici via JS -->
            </div>
        </div>
        <div id="beer-status"></div>
        <div id="pause-btn" class="pause-icon" style="display: none;">
            <div class="pause-bar"></div>
            <div class="pause-bar"></div>
        </div>

        <div id="startScreen" style="display: none;">
            <h1 class="game-title">RADEAU CRAFTER</h1>
            <div class="game-rules" data-i18n="jeu2.rules">Collect all the ingredients in the right order. Be aware of debuffs</div>
            <button class="startBtn" data-i18n="game.play">PLAY</button>
        </div>

        <div id="pauseScreen" style="display: none;">
            <h2 data-i18n="jeu2.pause">PAUSE</h2>
            <button class="startBtn" id="resumeBtn" data-i18n="game.resume">RESUME</button>
            <button class="startBtn" id="restartBtn" data-i18n="game.restart">RESTART</button>
            <button class="startBtn quitBtn" id="quitBtn" data-i18n="jeu2.quit">QUIT</button>
            <button class="lang-toggle-btn" onclick="toggleLang()">🇬🇧 EN</button>
        </div>

        <div id="victoryScreen" style="display: none;">
            <h1 class="game-title" data-i18n="jeu2.victory">VICTORY !</h1>
            <div class="game-rules" data-i18n="jeu2.victory-sub">You won a "Mulhousien outfit".</div>
            <div class="lehmann-victory-sprite"></div>
            <button class="startBtn" id="victoryContinueBtn" data-i18n="jeu2.continue">CONTINUE</button>
            <button class="startBtn" id="victoryRestartBtn" data-i18n="jeu2.replay">REPLAY</button>
        </div>
    </main>

    <script src="../assets/js/lang.js"></script>
    <script src="../assets/js/cinematic.js"></script>
    <script src="../assets/js/jeu2.js"></script>
</body>

</html>
