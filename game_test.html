<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sprite Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }

  h1 {
    font-size: 11px;
    letter-spacing: 4px;
    color: #444;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  #game-wrapper {
    position: relative;
    border: 1px solid #222;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
  }

  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #555;
    line-height: 1.8;
    pointer-events: none;
  }

  #hud span { color: #fff; }

  #controls {
    margin-top: 14px;
    display: flex;
    gap: 24px;
    font-size: 10px;
    letter-spacing: 3px;
    color: #333;
    text-transform: uppercase;
  }

  #controls span { color: #666; }

  #img-error {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    font-size: 11px;
    color: #e05a5a;
    letter-spacing: 2px;
    text-align: center;
    padding: 20px;
  }
  #img-error.show { display: flex; }
  #img-error small { color: #555; font-size: 10px; }
</style>
</head>
<body>

<h1>Sprite Test</h1>

<div id="game-wrapper">
  <canvas id="canvas"></canvas>

  <div id="hud">
    ANIM&nbsp;&nbsp;<span id="hud-anim">IDLE</span><br>
    FRAME&nbsp;<span id="hud-frame">0</span><br>
    POS&nbsp;&nbsp;&nbsp;<span id="hud-pos">0, 0</span>
  </div>

  <div id="img-error">
    IMAGE NON TROUVÉE
    <small>Mets spritesheet.png dans le même dossier que ce fichier</small>
  </div>
</div>

<div id="controls">
  <div>← → <span>déplacer</span></div>
  <div>espace <span>sauter</span></div>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────

// const SPRITE_SRC = 'spritesheet.webp';
const SPRITE_SRC = 'f.jpg';

// Chaque animation a ses propres dimensions de frame
// ⚠️ srcY : mesure le Y exact du début de chaque ligne dans ton image si ça décale
const ANIMS = {
  idle: { srcY: 0,   frames: 8, fps: 8,  frameW: 127, frameH: 290 },
  walk: { srcY: 340, frames: 8, fps: 14, frameW: 127, frameH: 280 },
  jump: { srcY: 680, frames: 6, fps: 12, frameW: 169, frameH: 340},
};

// Afficher le sprite à 50% de sa taille originale
const SCALE = 0.5;

// ─── CANVAS ──────────────────────────────────────────────────────────────────

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 800, H = 400;
canvas.width  = W;
canvas.height = H;

// ─── CHARGEMENT IMAGE ────────────────────────────────────────────────────────

const img = new Image();
img.src = SPRITE_SRC;
img.onerror = () => document.getElementById('img-error').classList.add('show');

// ─── ÉTAT DU JEU ─────────────────────────────────────────────────────────────

const GROUND     = H - 60;
const GRAVITY    = 0.55;
const JUMP_FORCE = -13;
const SPEED      = 3;

const player = {
  x: 100,
  y: GROUND,      // y = position du pied du perso
  vy: 0,
  onGround: true,
  facing: 1,      // 1 = droite, -1 = gauche
  anim: 'idle',
  frame: 0,
  lastFrameTime: 0,
};

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── LOGIQUE ─────────────────────────────────────────────────────────────────

function setAnim(name) {
  if (player.anim === name) return;
  player.anim  = name;
  player.frame = 0;
}

function update(timestamp) {
  // Déplacement horizontal
  let moving = false;
  if (keys['ArrowLeft'] || keys['KeyA']) {
    player.x     -= SPEED;
    player.facing = -1;
    moving = true;
  }
  if (keys['ArrowRight'] || keys['KeyD']) {
    player.x     += SPEED;
    player.facing = 1;
    moving = true;
  }

  // Saut
  if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
    player.vy       = JUMP_FORCE;
    player.onGround = false;
  }

  // Gravité
  player.vy += GRAVITY;
  player.y  += player.vy;

  // Sol
  if (player.y >= GROUND) {
    player.y        = GROUND;
    player.vy       = 0;
    player.onGround = true;
  }

  // Bords canvas (utilise la largeur de l'anim courante)
  const spriteW = ANIMS[player.anim].frameW * SCALE;
  player.x = Math.max(0, Math.min(W - spriteW, player.x));

  // Choix animation
  if (!player.onGround) {
    setAnim('jump');
  } else if (moving) {
    setAnim('walk');
  } else {
    setAnim('idle');
  }

  // Avance les frames selon le fps de l'anim
  const anim = ANIMS[player.anim];
  if (timestamp - player.lastFrameTime > 1000 / anim.fps) {
    player.frame = (player.frame + 1) % anim.frames;
    player.lastFrameTime = timestamp;
  }
}

// ─── RENDU ───────────────────────────────────────────────────────────────────

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0d0d0d');
  sky.addColorStop(1, '#111820');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Sol
  ctx.fillStyle = '#151515';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#222';
  ctx.fillRect(0, GROUND, W, 1);

  // Grille au sol
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 80) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
}

function drawPlayer() {
  const anim = ANIMS[player.anim];
  const srcX = player.frame * anim.frameW;
  const srcY = anim.srcY;
  const dstW = anim.frameW * SCALE;
  const dstH = anim.frameH * SCALE;

  // drawY : on remonte de la hauteur du sprite pour que les pieds soient sur player.y
  const drawY = player.y - dstH;

  ctx.save();

  if (player.facing === -1) {
    ctx.translate(player.x + dstW, drawY);
    ctx.scale(-1, 1);
    ctx.drawImage(img, srcX, srcY, anim.frameW, anim.frameH, 0, 0, dstW, dstH);
  } else {
    ctx.drawImage(img, srcX, srcY, anim.frameW, anim.frameH, player.x, drawY, dstW, dstH);
  }

  ctx.restore();
}

function drawHUD() {
  document.getElementById('hud-anim').textContent  = player.anim.toUpperCase();
  document.getElementById('hud-frame').textContent = player.frame;
  document.getElementById('hud-pos').textContent   = `${Math.round(player.x)}, ${Math.round(player.y)}`;
}

// ─── BOUCLE PRINCIPALE ───────────────────────────────────────────────────────

function loop(timestamp) {
  update(timestamp);
  drawBackground();
  if (img.complete && img.naturalWidth > 0) drawPlayer();
  drawHUD();
  requestAnimationFrame(loop);
}

img.onload = () => requestAnimationFrame(loop);
if (img.complete && img.naturalWidth > 0) requestAnimationFrame(loop);
</script>
</body>
</html>
