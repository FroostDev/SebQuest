<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seb Quest</title>
    <link rel="stylesheet" href="assets/styles/base.css">
    <link rel="stylesheet" href="assets/styles/main_menu.css">
</head>
<body>
    <button class="lang-toggle-btn" id="lang-btn-header" onclick="toggleLang()">🇬🇧 EN</button>

    <header>
        <div class="hamburger_menu" id="hamburger_menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav id="nav">
            <ul>
                <li><a href="pages/jeu1.html">Jeu 1</a></li>
                <li><a href="">Jeu 2</a></li>
                <li><a href="">Jeu 3</a></li>
            </ul>
        </nav>
    </header>

    <div class="start_overlay" id="start_overlay"><button class="yellow_btn_style" data-i18n="menu.enter">Commencer</button></div>

    <div class="header_container">
        <div class="game_title"><img src='assets/img/game_title.svg' alt='Seb Quest'></div>
        <a href="pages/carte.html" class="start_game_btn yellow_btn_style" data-i18n="menu.start">Démarrer</a>
        <button id="reset-btn" class="reset_btn_style" data-i18n="menu.reset">Recommencer depuis le début</button>
    </div>

    <div id="reset-confirm-overlay">
        <div id="reset-confirm-box">
            <p id="reset-confirm-text" data-i18n-html="reset.text">Ta progression sera effacée.<br>Es-tu sûr ?</p>
            <div id="reset-confirm-actions">
                <button id="reset-confirm-yes" class="yellow_btn_style" data-i18n="reset.yes">Oui</button>
                <button id="reset-confirm-no" class="yellow_btn_style" data-i18n="reset.no">Non</button>
            </div>
        </div>
    </div>

    <script src="assets/js/lang.js"></script>
    <script src="assets/js/main_menu.js"></script>
</body>
</html>
